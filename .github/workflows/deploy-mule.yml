name: Deploy Mule application to CloudHub 2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve Anypoint organization
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          TOKEN="$(curl --fail --silent --show-error \
            --request POST 'https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$ANYPOINT_CLIENT_ID" \
            --data-urlencode "client_secret=$ANYPOINT_CLIENT_SECRET" \
            --data-urlencode 'grant_type=client_credentials' | jq -r '.access_token')"

          test -n "$TOKEN" && test "$TOKEN" != "null"

          ORG_ID="$(curl --fail --silent --show-error \
            --request GET 'https://anypoint.mulesoft.com/accounts/api/me' \
            --header "Authorization: Bearer $TOKEN" | jq -r '.organization.id')"

          test -n "$ORG_ID" && test "$ORG_ID" != "null"
          echo "ANYPOINT_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"

      - name: Deploy directly to CloudHub 2.0
        run: >
          mvn --batch-mode
          clean deploy
          -DmuleDeploy
          -Danypoint.client.id="${{ secrets.ANYPOINT_CLIENT_ID }}"
          -Danypoint.client.secret="${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          -Dcloudhub.application.name="${{ secrets.CLOUDHUB_APPLICATION_NAME }}"
          -Dcloudhub.environment="${{ secrets.CLOUDHUB_ENVIRONMENT }}"
          -Dcloudhub.target="${{ secrets.CLOUDHUB_TARGET }}"
          -Dcloudhub.replicas="${{ secrets.CLOUDHUB_REPLICAS }}"
          -Dcloudhub.vcores="${{ secrets.CLOUDHUB_VCORES }}"

      - name: Deployment summary
        if: success()
        run: |
          echo "CloudHub 2.0 deployment completed."
          echo "Application: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}"
          echo "Environment: ${{ secrets.CLOUDHUB_ENVIRONMENT }}"
          echo "Target: ${{ secrets.CLOUDHUB_TARGET }}"
