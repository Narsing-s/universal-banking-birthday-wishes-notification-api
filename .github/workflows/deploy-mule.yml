name: Deploy Mule application to CloudHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Deploy to CloudHub
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: >
          mvn --batch-mode clean deploy -DmuleDeploy
          -Danypoint.client.id="${{ secrets.ANYPOINT_CLIENT_ID }}"
          -Danypoint.client.secret="${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          -Dcloudhub.application.name="${{ secrets.CLOUDHUB_APPLICATION_NAME }}"
          -Dcloudhub.environment="${{ secrets.CLOUDHUB_ENVIRONMENT }}"
          -Dcloudhub.region="${{ secrets.CLOUDHUB_REGION }}"
          -Dcloudhub.workers="${{ secrets.CLOUDHUB_WORKERS }}"
          -Dcloudhub.workerType="${{ secrets.CLOUDHUB_WORKER_TYPE }}"

      - name: Deployment summary
        if: success()
        run: |
          echo "CloudHub deployment completed."
          echo "Application: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}"
          echo "Environment: ${{ secrets.CLOUDHUB_ENVIRONMENT }}"
