name: Mule CI/CD - Permission, Artifact Validation & Multi-Region Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - sandbox
          - prod
          - all
        default: dev

permissions:
  contents: write
  actions: read

concurrency:
  group: mule-cicd-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  permission-check:
    name: 🔐 User Permission Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow actor has deployment permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          actor="${{ github.actor }}"
          permission=$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" \
            --jq '.permission')

          echo "Actor: ${actor}"
          echo "Repository permission: ${permission}"

          case "${permission}" in
            admin|maintain|push)
              echo "Permission check passed."
              ;;
            *)
              echo "::error::Deployment requires push, maintain, or admin repository permission."
              exit 1
              ;;
          esac

  source-preflight:
    name: 🔎 Source & Pipeline Preflight Verification
    runs-on: ubuntu-latest
    needs: permission-check
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected deployment source
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test -n "${GITHUB_SHA}"
          git status --porcelain
          git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | sed '/^$/d' | head -200
          echo "Source SHA: ${GITHUB_SHA}"
          echo "Ref: ${GITHUB_REF}"

      - name: Verify mandatory Mule project structure
        run: |
          set -euo pipefail
          required=(
            pom.xml
            mule-artifact.json
            src/main/mule/universal-banking-birthday-wishes-notification-api.xml
            src/main/resources/config/cloud.yaml
            src/main/resources/config/local.yaml.example
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required project file: $file"; exit 1; }
          done
          echo "Mule project structure verified."

      - name: Materialize Maven organization coordinates for validation
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "${ANYPOINT_ORG_ID}"
          perl -0pi -e 's/\$\{env\.ANYPOINT_ORG_ID\}/$ENV{ANYPOINT_ORG_ID}/g' pom.xml
          echo "Maven organization coordinates materialized for validation."

      - name: Validate Maven model before build
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress validate -DskipTests
          echo "Maven model validation passed."

      - name: Validate Mule XML syntax
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout src/main/mule/universal-banking-birthday-wishes-notification-api.xml
          echo "Mule XML syntax validation passed."

  validate-config:
    name: "🧩 Validate CI/CD — ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    needs: permission-check
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'push' && '["dev"]' || inputs.environment == 'all' && '["dev","qa","sandbox","prod"]' || format('["{0}"]', inputs.environment)) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Verify GitHub Environment secrets
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          CLOUDHUB_APPLICATION_NAME: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}
          CLOUDHUB_ENVIRONMENT: ${{ secrets.CLOUDHUB_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ secrets.CLOUDHUB_TARGET }}
          CLOUDHUB_REPLICAS: ${{ secrets.CLOUDHUB_REPLICAS }}
          CLOUDHUB_VCORES: ${{ secrets.CLOUDHUB_VCORES }}
          DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
          DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
          DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
          DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
          DB_SF_USER: ${{ secrets.DB_SF_USER }}
          DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
          DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          failed=0
          for name in ANYPOINT_ORG_ID ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET CLOUDHUB_APPLICATION_NAME CLOUDHUB_ENVIRONMENT CLOUDHUB_TARGET CLOUDHUB_REPLICAS CLOUDHUB_VCORES DB_SF_NAME DB_SF_WAREHOUSE DB_SF_DATABASE DB_SF_SCHEMA DB_SF_USER DB_SF_PASSWORD DB_SF_ROLE SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::[${{ matrix.environment }}] Missing required GitHub Environment secret: ${name}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::[${{ matrix.environment }}] Required secrets are missing. No deployment will be started."
            exit 1
          fi
          echo "[${{ matrix.environment }}] All required GitHub Environment secrets are present."

      - name: Validate environment-specific deployment configuration
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          CLOUDHUB_APPLICATION_NAME: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}
          CLOUDHUB_ENVIRONMENT: ${{ secrets.CLOUDHUB_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ secrets.CLOUDHUB_TARGET }}
          CLOUDHUB_REPLICAS: ${{ secrets.CLOUDHUB_REPLICAS }}
          CLOUDHUB_VCORES: ${{ secrets.CLOUDHUB_VCORES }}
          DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
          DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
          DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
          DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
          DB_SF_USER: ${{ secrets.DB_SF_USER }}
          DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
          DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          failed=0
          for name in ANYPOINT_ORG_ID ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET CLOUDHUB_APPLICATION_NAME CLOUDHUB_ENVIRONMENT CLOUDHUB_REPLICAS CLOUDHUB_VCORES DB_SF_NAME DB_SF_WAREHOUSE DB_SF_DATABASE DB_SF_SCHEMA DB_SF_USER DB_SF_PASSWORD DB_SF_ROLE SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::[${{ matrix.environment }}] Missing required GitHub Environment secret: ${name}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::[${{ matrix.environment }}] deployment configuration is incomplete. Deployment refused."
            exit 1
          fi
          echo "Environment [${{ matrix.environment }}] is isolated."
          echo "Application: ${CLOUDHUB_APPLICATION_NAME}"
          echo "CloudHub environment: ${CLOUDHUB_ENVIRONMENT}"
          case "${{ matrix.environment }}" in
            dev) expected_name="dev"; expected_id="79403e5e-3282-440a-b10b-e102ae052d0c" ;;
            qa) expected_name="qa"; expected_id="b557d817-7ca7-4c9d-a341-fb5110df26d1" ;;
            sandbox) expected_name="Sandbox"; expected_id="f63db7fe-e2dc-4410-a6d9-7810f0c713f6" ;;
            prod) expected_name="prod"; expected_id="38375706-c667-4d01-8d3e-56882a29fe8b" ;;
            *) echo "::error::Unsupported deployment environment: ${{ matrix.environment }}"; exit 1 ;;
          esac
          echo "Configured CloudHub environment for ${{ matrix.environment }}: ${CLOUDHUB_ENVIRONMENT}"
          echo "Expected Anypoint environment: ${expected_name} (${expected_id})"
          echo "Shared CloudHub target: ${CLOUDHUB_TARGET}"
          case "${{ matrix.environment }}" in
            dev) echo "::notice::🔵 TARGET ENVIRONMENT: DEV — GitHub Environment [dev]" ;;
            qa) echo "::notice::🟡 TARGET ENVIRONMENT: QA — GitHub Environment [qa]" ;;
            sandbox) echo "::notice::🟣 TARGET ENVIRONMENT: SANDBOX — GitHub Environment [sandbox]" ;;
            prod) echo "::warning::🔴 TARGET ENVIRONMENT: PRODUCTION — GitHub Environment [prod]" ;;
          esac
          echo "Anypoint Org ID: ${ANYPOINT_ORG_ID}"
          echo "Connected App Client ID is configured (length ${#ANYPOINT_CLIENT_ID})"
          echo "Connected App Secret is configured (length ${#ANYPOINT_CLIENT_SECRET})"

      - name: 🔑 Verify Connected App authentication
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "🔐 ANYPOINT CONNECTED APP AUTHENTICATION"
          echo "Environment: ${{ matrix.environment }}"
          echo "============================================================"
          test -n "${ANYPOINT_CLIENT_ID}" || { echo "::error::ANYPOINT_CLIENT_ID is empty in GitHub Environment ${{ matrix.environment }}."; exit 1; }
          test -n "${ANYPOINT_CLIENT_SECRET}" || { echo "::error::ANYPOINT_CLIENT_SECRET is empty in GitHub Environment ${{ matrix.environment }}."; exit 1; }
          response="$(curl -sS -w "\n%{http_code}" -X POST "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"
          status="$(printf "%s\n" "${response}" | tail -n1)"
          body="$(printf "%s\n" "${response}" | sed "$d")"
          if [ "${status}" != "200" ]; then
            error_code="$(jq -r ".error // empty" <<<"${body}" 2>/dev/null || true)"
            error_description="$(jq -r ".error_description // .message // empty" <<<"${body}" 2>/dev/null || true)"
            echo "::error::${{ matrix.environment }} Connected App authentication failed: HTTP ${status}."
            [ -n "${error_code}" ] && echo "::error::Anypoint error: ${error_code}"
            [ -n "${error_description}" ] && echo "::error::Anypoint message: ${error_description}"
            echo "::error::Check ANYPOINT_CLIENT_ID and ANYPOINT_CLIENT_SECRET in GitHub Environment ${{ matrix.environment }}. Verify the Connected App is active and authorized for this organization."
            exit 1
          fi
          token="$(jq -r ".access_token // empty" <<<"${body}")"
          test -n "${token}" || { echo "::error::HTTP 200 received but no access_token was returned."; exit 1; }
          echo "::notice::${{ matrix.environment }} Connected App authentication successful."

  build-artifact:
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment == 'all' && 'dev' || inputs.environment }}
    name: 📦 Build & Package Mule Artifact
    runs-on: ubuntu-latest
    needs:
      - source-preflight
      - validate-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Mule XML before Maven
        run: |
          set -euo pipefail
          xml_file="src/main/mule/universal-banking-birthday-wishes-notification-api.xml"
          test -s "$xml_file"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout "$xml_file"
          echo "Mule XML is well-formed: $xml_file"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Exchange authentication
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>exchange-repository</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Materialize Maven organization coordinates
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/\$\{env\.ANYPOINT_ORG_ID\}/$ENV{ANYPOINT_ORG_ID}/g' pom.xml

      - name: Package application
        env:
          OID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          set -euo pipefail
          mvn --batch-mode clean package -Denv.ANYPOINT_ORG_ID="$OID"
          artifact=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n1)
          if [ -z "$artifact" ]; then
            echo "::error::No Mule application JAR was produced."
            exit 1
          fi
          echo "Artifact: $artifact"
          test -s target/classes/site/index.html || { echo "::error::Dashboard UI is missing from target/classes/site/index.html"; exit 1; }
          unzip -l "$artifact" | grep -q "site/index.html" || { echo "::error::Dashboard UI is missing from the Mule JAR"; exit 1; }
          echo "Dashboard UI verified in immutable JAR."
          (cd target && sha256sum "$(basename "$artifact")" | tee mule-artifact.sha256)
          jar_name="$(basename "$artifact")"
          jar_sha256="$(cut -d' ' -f1 target/mule-artifact.sha256)"
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "jar_name=${jar_name}"
            echo "jar_sha256=${jar_sha256}"
            echo "runtime_env=cloud"
            echo "source_ref=${GITHUB_REF}"
            echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > target/mule-build-manifest.txt
          cat target/mule-build-manifest.txt

      - name: Publish application to Anypoint Exchange
        env:
          OID: ${{ secrets.ANYPOINT_ORG_ID }}
          CID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CSEC: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: bash .github/scripts/publish-exchange-v101.sh

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-application-${{ github.sha }}
          path: |
            target/*.jar
            target/mule-artifact.sha256
            target/mule-build-manifest.txt
          if-no-files-found: error
          retention-days: 14

  artifact-check:
    environment: ${{ inputs.environment == 'all' && 'dev' || inputs.environment }}
    name: 🧪 Artifact Validation
    runs-on: ubuntu-latest
    needs: build-artifact
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application-${{ github.sha }}
          path: artifact

      - name: Validate artifact structure and checksum
        run: |
          set -euo pipefail
          jars=(artifact/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Mule application JAR; found ${#jars[@]}."
            exit 1
          fi
          jar="${jars[0]}"
          test -s "$jar"
          test -s artifact/mule-artifact.sha256
          (cd artifact && sha256sum -c mule-artifact.sha256)
          unzip -l "$jar" | grep -q 'mule-artifact.json' || { echo "::error::mule-artifact.json is missing from the application artifact."; exit 1; }
          test -s artifact/mule-build-manifest.txt
          grep -q "^commit_sha=${GITHUB_SHA}$" artifact/mule-build-manifest.txt
          grep -q "^runtime_env=cloud$" artifact/mule-build-manifest.txt
          grep -q "^source_ref=refs/heads/main$" artifact/mule-build-manifest.txt
          manifest_jar_sha="$(awk -F= '$1=="jar_sha256"{print $2}' artifact/mule-build-manifest.txt)"
          actual_jar_sha="$(sha256sum "$jar" | cut -d' ' -f1)"
          test "$manifest_jar_sha" = "$actual_jar_sha"
          echo "Artifact validation passed."
          echo "Build manifest:"
          cat artifact/mule-build-manifest.txt
          echo "Artifact: $(basename "$jar")"
          echo "Size: $(du -h "$jar" | cut -f1)"

  deploy-west:
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'push' && '["dev"]' || inputs.environment == 'all' && '["dev","qa","sandbox","prod"]' || format('["{0}"]', inputs.environment)) }}
    name: 🌎 Deploy — WEST
    runs-on: ubuntu-latest
    needs: artifact-check
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout deployment descriptor
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application-${{ github.sha }}
          path: artifact
      - name: Deploy WEST
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
          DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
          DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
          DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
          DB_SF_USER: ${{ secrets.DB_SF_USER }}
          DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
          DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
          REGION_NAME: WEST
          CLOUDHUB_APPLICATION_NAME: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}
          CLOUDHUB_ENVIRONMENT: ${{ secrets.CLOUDHUB_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ secrets.CLOUDHUB_TARGET }}
          CLOUDHUB_REPLICAS: ${{ secrets.CLOUDHUB_REPLICAS }}
          CLOUDHUB_VCORES: ${{ secrets.CLOUDHUB_VCORES }}
        run: |
          set -euo pipefail
          artifact=$(find artifact -maxdepth 1 -type f -name '*.jar' | head -n1)
          test -n "$CLOUDHUB_TARGET"
          test -s artifact/mule-artifact.sha256
          (cd artifact && sha256sum -c mule-artifact.sha256)
          echo "Deploying immutable artifact: $(basename "$artifact")"
          echo "Artifact SHA-256: $(sha256sum "$artifact" | cut -d' ' -f1)"
          mvn --batch-mode mule:deploy \
            -Dmule.artifact="$artifact" \
            -DmuleDeploy \
            -Denv.ANYPOINT_ORG_ID="$ANYPOINT_ORG_ID" \
            -Danypoint.client.id="$ANYPOINT_CLIENT_ID" \
            -Danypoint.client.secret="$ANYPOINT_CLIENT_SECRET" \
            -Dcloudhub.application.name="${CLOUDHUB_APPLICATION_NAME}-west" \
            -Dcloudhub.environment="$CLOUDHUB_ENVIRONMENT" \
            -Dcloudhub.target="$CLOUDHUB_TARGET" \
            -Dcloudhub.replicas="$CLOUDHUB_REPLICAS" \
            -Dcloudhub.vcores="$CLOUDHUB_VCORES" \
            -Denv.REGION_NAME="$REGION_NAME"

  deploy-westb:
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'push' && '["dev"]' || inputs.environment == 'all' && '["dev","qa","sandbox","prod"]' || format('["{0}"]', inputs.environment)) }}
    name: 🌎 Deploy — WESTB
    runs-on: ubuntu-latest
    needs: artifact-check
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout deployment descriptor
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application-${{ github.sha }}
          path: artifact
      - name: Deploy WESTB
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
          DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
          DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
          DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
          DB_SF_USER: ${{ secrets.DB_SF_USER }}
          DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
          DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
          REGION_NAME: WESTB
          CLOUDHUB_APPLICATION_NAME: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}
          CLOUDHUB_ENVIRONMENT: ${{ secrets.CLOUDHUB_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ secrets.CLOUDHUB_TARGET }}
          CLOUDHUB_REPLICAS: ${{ secrets.CLOUDHUB_REPLICAS }}
          CLOUDHUB_VCORES: ${{ secrets.CLOUDHUB_VCORES }}
        run: |
          set -euo pipefail
          artifact=$(find artifact -maxdepth 1 -type f -name '*.jar' | head -n1)
          test -n "$CLOUDHUB_TARGET"
          test -s artifact/mule-artifact.sha256
          (cd artifact && sha256sum -c mule-artifact.sha256)
          echo "Deploying immutable artifact: $(basename "$artifact")"
          echo "Artifact SHA-256: $(sha256sum "$artifact" | cut -d' ' -f1)"
          mvn --batch-mode mule:deploy \
            -Dmule.artifact="$artifact" \
            -DmuleDeploy \
            -Denv.ANYPOINT_ORG_ID="$ANYPOINT_ORG_ID" \
            -Danypoint.client.id="$ANYPOINT_CLIENT_ID" \
            -Danypoint.client.secret="$ANYPOINT_CLIENT_SECRET" \
            -Dcloudhub.application.name="${CLOUDHUB_APPLICATION_NAME}-westb" \
            -Dcloudhub.environment="$CLOUDHUB_ENVIRONMENT" \
            -Dcloudhub.target="$CLOUDHUB_TARGET" \
            -Dcloudhub.replicas="$CLOUDHUB_REPLICAS" \
            -Dcloudhub.vcores="$CLOUDHUB_VCORES" \
            -Denv.REGION_NAME="$REGION_NAME"

  deploy-east:
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'push' && '["dev"]' || inputs.environment == 'all' && '["dev","qa","sandbox","prod"]' || format('["{0}"]', inputs.environment)) }}
    name: 🌎 Deploy — EAST
    runs-on: ubuntu-latest
    needs: artifact-check
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout deployment descriptor
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application-${{ github.sha }}
          path: artifact
      - name: Deploy EAST
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
          DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
          DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
          DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
          DB_SF_USER: ${{ secrets.DB_SF_USER }}
          DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
          DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
          REGION_NAME: EAST
          CLOUDHUB_APPLICATION_NAME: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}
          CLOUDHUB_ENVIRONMENT: ${{ secrets.CLOUDHUB_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ secrets.CLOUDHUB_TARGET }}
          CLOUDHUB_REPLICAS: ${{ secrets.CLOUDHUB_REPLICAS }}
          CLOUDHUB_VCORES: ${{ secrets.CLOUDHUB_VCORES }}
        run: |
          set -euo pipefail
          artifact=$(find artifact -maxdepth 1 -type f -name '*.jar' | head -n1)
          test -n "$CLOUDHUB_TARGET"
          test -s artifact/mule-artifact.sha256
          (cd artifact && sha256sum -c mule-artifact.sha256)
          echo "Deploying immutable artifact: $(basename "$artifact")"
          echo "Artifact SHA-256: $(sha256sum "$artifact" | cut -d' ' -f1)"
          mvn --batch-mode mule:deploy \
            -Dmule.artifact="$artifact" \
            -DmuleDeploy \
            -Denv.ANYPOINT_ORG_ID="$ANYPOINT_ORG_ID" \
            -Danypoint.client.id="$ANYPOINT_CLIENT_ID" \
            -Danypoint.client.secret="$ANYPOINT_CLIENT_SECRET" \
            -Dcloudhub.application.name="${CLOUDHUB_APPLICATION_NAME}-east" \
            -Dcloudhub.environment="$CLOUDHUB_ENVIRONMENT" \
            -Dcloudhub.target="$CLOUDHUB_TARGET" \
            -Dcloudhub.replicas="$CLOUDHUB_REPLICAS" \
            -Dcloudhub.vcores="$CLOUDHUB_VCORES" \
            -Denv.REGION_NAME="$REGION_NAME"

  publish-api-config:
    name: 🔗 Publish Live CloudHub API Endpoints
    runs-on: ubuntu-latest
    needs:
      - deploy-west
      - deploy-westb
      - deploy-east
    if: needs.deploy-west.result == 'success' && needs.deploy-westb.result == 'success' && needs.deploy-east.result == 'success'
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve deployed CloudHub URLs
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          CLOUDHUB_ENVIRONMENT: ${{ secrets.CLOUDHUB_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ secrets.CLOUDHUB_TARGET }}
          CLOUDHUB_APPLICATION_NAME: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}
        run: bash .github/scripts/resolve-api-config.sh
      - name: Upload resolved endpoint configuration
        uses: actions/upload-artifact@v4
        with:
          name: live-api-config-${{ github.sha }}
          path: ui/api-config.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish endpoint configuration to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/ui/api-config.json" --jq '.sha')"
          content="$(base64 -w0 ui/api-config.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ui/api-config.json" \
            -f message="chore: refresh live API endpoints [skip ci]" \
            -f content="${content}" \
            -f sha="${sha}" \
            -f branch="main"

  smoke-test-regions:
  # Smoke-test paths are relative to each resolved CloudHub root domain.
    name: 🩺 Post-Deployment Smoke Test — 3 Regions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - deploy-west
      - deploy-westb
      - deploy-east
      - publish-api-config
    if: always() && needs.deploy-west.result == 'success' && needs.deploy-westb.result == 'success' && needs.deploy-east.result == 'success' && needs.publish-api-config.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Verify live UI and API endpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          config="$(gh api "repos/${GITHUB_REPOSITORY}/contents/ui/api-config.json" --jq '.content' | base64 -d)"
          mapfile -t bases < <(jq -r '.apiBases[]' <<<"${config}")
          test "$(printf '%s\n' "${bases[@]}" | wc -l)" -eq 3 || { echo "::error::Expected three live API bases."; exit 1; }

          regions=(
            "WEST|${bases[0]}"
            "WESTB|${bases[1]}"
            "EAST|${bases[2]}"
          )

          smoke() {
            local region="$1"
            local base="$2"
            local path="$3"
            local url="${base}${path}"
            echo "[$region] GET $url"
            for attempt in {1..12}; do
              code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 45 --retry 0 -o /dev/null -w "%{http_code}" "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "[$region] PASS $path (HTTP 200)"
                return 0
              fi
              echo "[$region] attempt $attempt/12 failed: HTTP $code"
              sleep 10
            done
            return 1
          }
          optional_smoke() {
            local region="$1"
            local base="$2"
            local path="$3"
            if smoke "$region" "$base" "$path"; then
              echo "[$region] PASS optional $path"
            else
              echo "::warning::[$region] Optional diagnostic endpoint is unavailable: $path"
            fi
          }
          failed=0
          for entry in "${regions[@]}"; do
            IFS="|" read -r region base <<< "$entry"
            smoke "$region" "$base" "/health/dependencies" || failed=1
            smoke "$region" "$base" "/dashboard" || failed=1
            smoke "$region" "$base" "/customers?page=1&limit=1" || failed=1
            optional_smoke "$region" "$base" "/runtime-info"
            optional_smoke "$region" "$base" "/health"
            optional_smoke "$region" "$base" "/outbox"
            if smoke "$region" "$base" "/"; then
              echo "[$region] PASS /"
            else
              echo "::warning::[$region] Root path returned no HTTP 200; API data routes are the deployment gate."
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more regions failed the critical UI data smoke tests (/api/dashboard or /api/customers)."
            exit 1
          fi
          echo "All three regions passed critical UI data smoke tests."

  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs:
      - permission-check
      - validate-config
      - build-artifact
      - artifact-check
      - deploy-west
      - deploy-westb
      - deploy-east
      - smoke-test-regions
    if: always()
    steps:
      - name: Publish deployment graph and status
        run: |
          {
            echo "## 🚀 Multi-Region Deployment"
            echo ""
            echo "| Deployment selection | ${{ inputs.environment }} |"
            echo ""
            echo "| Stage | Status |"
            echo "|---|---|"
            echo "| 🔐 User permission | ${{ needs.permission-check.result }} |"
            echo "| 🧩 Configuration validation | ${{ needs.validate-config.result }} |"
            echo "| 📦 Build artifact | ${{ needs.build-artifact.result }} |"
            echo "| 🧪 Artifact validation | ${{ needs.artifact-check.result }} |"
            echo "| 🌎 WEST | ${{ needs.deploy-west.result }} |"
            echo "| 🌎 WESTB | ${{ needs.deploy-westb.result }} |"
            echo "| 🌎 EAST | ${{ needs.deploy-east.result }} |"
            echo "| 🩺 Regional smoke tests | ${{ needs.smoke-test-regions.result }} |"
            echo ""
            echo "### Pipeline flow"
            echo ""
            echo 'Permission Check → Configuration Validation → Build → Artifact Check → **WEST**'
            echo ""
            echo '                                                             ↘ **WESTB**'
            echo ""
            echo '                                                             ↘ **EAST**'
            echo ""
            echo "The three regional deployments consume the same immutable JAR produced by the build."
          } >> "$GITHUB_STEP_SUMMARY"
