name: Deploy Mule application to CloudHub 2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Anypoint organization secret
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          if [ -z "$ANYPOINT_ORG_ID" ]; then
            echo "::error::Missing GitHub Actions secret ANYPOINT_ORG_ID."
            echo "Add the Anypoint Platform Organization ID as the ANYPOINT_ORG_ID repository secret."
            exit 1
          fi

      - name: Validate Connected App authentication
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          if [ -z "$ANYPOINT_CLIENT_ID" ] || [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "::error::Missing ANYPOINT_CLIENT_ID or ANYPOINT_CLIENT_SECRET GitHub Actions secret."
            exit 1
          fi

          response=$(curl -sS -w '\n%{http_code}' \
            -X POST 'https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=$ANYPOINT_CLIENT_ID" \
            --data-urlencode "client_secret=$ANYPOINT_CLIENT_SECRET")

          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')

          if [ "$status" != "200" ]; then
            echo "::error::Anypoint Connected App authentication failed with HTTP $status."
            echo "$body" | sed -E 's/"access_token":"[^"]+"/"access_token":"[REDACTED]"/g'
            exit 1
          fi

          if ! printf '%s' "$body" | grep -q '"access_token"'; then
            echo "::error::Anypoint returned HTTP 200 but no access token was present."
            exit 1
          fi

          echo "Connected App authentication succeeded."
      - name: Configure Exchange authentication
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>exchange-repository</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Materialize Maven organization coordinates
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          perl -0pi -e 's/\$\{env\.ANYPOINT_ORG_ID\}/$ENV{ANYPOINT_ORG_ID}/g' pom.xml
          if grep -q '\${env.ANYPOINT_ORG_ID}' pom.xml; then
            echo "::error::Maven organization placeholder was not resolved."
            exit 1
          fi
          echo "Maven organization coordinates prepared."

      - name: Package and publish application to Anypoint Exchange
        env:
          OID: ${{ secrets.ANYPOINT_ORG_ID }}
          CID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CSEC: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn --batch-mode clean package -Denv.ANYPOINT_ORG_ID="$OID"
          bash .github/scripts/publish-exchange-v101.sh

      - name: Deploy Exchange asset to CloudHub 2.0
        env:
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          DB_SF_NAME: ${{ secrets.DB_SF_NAME }}
          DB_SF_WAREHOUSE: ${{ secrets.DB_SF_WAREHOUSE }}
          DB_SF_DATABASE: ${{ secrets.DB_SF_DATABASE }}
          DB_SF_SCHEMA: ${{ secrets.DB_SF_SCHEMA }}
          DB_SF_USER: ${{ secrets.DB_SF_USER }}
          DB_SF_PASSWORD: ${{ secrets.DB_SF_PASSWORD }}
          DB_SF_ROLE: ${{ secrets.DB_SF_ROLE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
        run: >
          mvn --batch-mode
          mule:deploy
          -DmuleDeploy
          -Denv.ANYPOINT_ORG_ID="$ANYPOINT_ORG_ID"
          -Danypoint.client.id="$ANYPOINT_CLIENT_ID"
          -Danypoint.client.secret="$ANYPOINT_CLIENT_SECRET"
          -Dcloudhub.application.name="${{ secrets.CLOUDHUB_APPLICATION_NAME }}"
          -Dcloudhub.environment="${{ secrets.CLOUDHUB_ENVIRONMENT }}"
          -Dcloudhub.target="${{ secrets.CLOUDHUB_TARGET }}"
          -Dcloudhub.replicas="${{ secrets.CLOUDHUB_REPLICAS }}"
          -Dcloudhub.vcores="${{ secrets.CLOUDHUB_VCORES }}"
      - name: Deployment summary
        if: success()
        run: |
          echo "CloudHub 2.0 deployment completed."
          echo "Application: ${{ secrets.CLOUDHUB_APPLICATION_NAME }}"
          echo "Environment: ${{ secrets.CLOUDHUB_ENVIRONMENT }}"
          echo "Target: ${{ secrets.CLOUDHUB_TARGET }}"
