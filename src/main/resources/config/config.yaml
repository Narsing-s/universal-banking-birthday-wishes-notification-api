# Safe configuration template — no real credentials
# Copy to src/main/resources/config/local.yaml for local development.
# Keep local.yaml out of Git and provide real values through your deployment secret store.

db:
  sf:
    name: "YOUR_SNOWFLAKE_ACCOUNT"
    warehouse: "YOUR_SNOWFLAKE_WAREHOUSE"
    database: "MYDATABASE"
    schema: "PUBLIC"
    user: "YOUR_SNOWFLAKE_USER"
    password: "YOUR_SNOWFLAKE_PASSWORD"
    role: "YOUR_SNOWFLAKE_ROLE"

smtp:
  host: "smtp.gmail.com"
  port: "587"
  user: "YOUR_SMTP_USER"
  password: "YOUR_SMTP_APP_PASSWORD"

ultramsg:
  token: "YOUR_ULTRAMSG_TOKEN"
